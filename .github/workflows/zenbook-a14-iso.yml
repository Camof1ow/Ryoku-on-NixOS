# ASUS Zenbook A14 UX3407RA(Snapdragon X Elite)용 aarch64 설치 ISO를 arm64 러너에서 빌드한다.
# 설치될 시스템을 먼저 빌드해 실패를 일찍 드러내고, 그 클로저를 ISO에 넣는다.
name: Zenbook A14 ISO (aarch64)

on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - 'nix/**'
      - '.github/workflows/zenbook-a14-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenbook-a14-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build aarch64 installer ISO
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          extra-conf: |
            max-jobs = auto
            cores = 0

      - name: Evaluate ISO
        shell: bash
        run: |
          set -euo pipefail
          nix eval --raw .#packages.aarch64-linux.ryoku-iso-zenbook-a14.drvPath
          echo

      - name: Build installed system
        shell: bash
        run: |
          set -euo pipefail
          nix build -L --keep-going --no-link --print-out-paths \
            .#packages.aarch64-linux.ryoku-zenbook-a14-system
          df -h /

      - name: Build ISO
        shell: bash
        run: |
          set -euo pipefail
          nix build -L --print-out-paths -o result-iso \
            .#packages.aarch64-linux.ryoku-iso-zenbook-a14
          ls -la result-iso/iso
          sha256sum result-iso/iso/*.iso | tee result-iso.sha256
          df -h /

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ryoku-zenbook-a14-iso
          path: |
            result-iso/iso/*.iso
            result-iso.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
